<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaNô - Đăng Ký</title>
    <link rel="icon" type="image/png" href="logon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #003079 0%, #001a72 100%); display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; overflow: hidden; padding: 20px; }
        
        #custom-toast { position: fixed; top: 20px; right: 20px; background: rgba(30, 41, 59, 0.95); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); z-index: 10000; display: none; font-size: 0.9rem; }

        .auth-box { background: white; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); text-align: center; }
        .auth-box h2 { margin-bottom: 24px; color: #0068ff; font-size: 1.8rem; font-weight: 700; }
        .auth-box input { width: 100%; padding: 12px 16px; margin-bottom: 14px; border: 1px solid #d8dae0; border-radius: 8px; outline: none; font-size: 1rem; }
        .auth-box button { width: 100%; padding: 14px; background: #0068ff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
        .auth-box button:hover { background: #0056d2; }
        .toggle-link { margin-top: 16px; font-size: 0.85rem; color: #64748b; }
        .toggle-link a { color: #0068ff; cursor: pointer; font-weight: bold; text-decoration: none; }
        .toggle-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="custom-toast">Thông báo</div>

    <!-- Form Đăng Ký -->
    <div class="auth-box" id="register-box">
        <h2>Tạo Tài Khoản DaNô</h2>
        <input type="text" id="reg-name" placeholder="Tên hiển thị..." maxlength="10" autocomplete="off">
        <input type="text" id="reg-id" placeholder="ID tài khoản..." maxlength="10" autocomplete="off">
        <input type="password" id="reg-pass" placeholder="Mật khẩu (tối thiểu 8 ký tự)...">
        <button id="register-btn">Tạo Tài Khoản</button>
        <div class="toggle-link">Đã có tài khoản? <a href="login.html">Đăng nhập</a></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-5yAQRXVMAHDNWjguSzs9Gpxy2pWAFtg",
            authDomain: "superdokichat.firebaseapp.com",
            projectId: "superdokichat",
            storageBucket: "superdokichat.firebasestorage.app",
            messagingSenderId: "1093619058272",
            appId: "1:1093619058272:web:f5f5956e521f96ec3c2505"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const usersRef = collection(db, "users");

        // Nếu người dùng đã đăng nhập rồi thì cho chuyển thẳng sang ứng dụng chính
        if (localStorage.getItem("z_user_id")) {
            window.location.href = "index.html";
        }

        function showToast(msg) {
            const toast = document.getElementById("custom-toast");
            toast.innerText = msg; 
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 3000);
        }

        // Xử lý Đăng Ký
        async function handleRegister() {
            const name = document.getElementById("reg-name").value.trim();
            const id = document.getElementById("reg-id").value.trim().toLowerCase();
            const pass = document.getElementById("reg-pass").value.trim();

            if (!name || !id || !pass) return showToast("Hãy điền đủ thông tin!");
            
            // Kiểm tra giới hạn ký tự
            if (name.length > 10) return showToast("Tên hiển thị chỉ được tối đa 10 ký tự!");
            if (id.length > 10) return showToast("ID tài khoản chỉ được tối đa 10 ký tự!");
            
            // Kiểm tra độ dài mật khẩu
            if (pass.length < 8) return showToast("Mật khẩu phải chứa ít nhất 8 ký tự!");

            try {
                // Kiểm tra ID đã tồn tại chưa
                const snapshot = await getDocs(query(usersRef, where("userId", "==", id)));
                if (!snapshot.empty) return showToast("ID này đã có người dùng!");

                const defaultAvatar = "https://www.w3schools.com/howto/img_avatar.png";

                // Lưu user mới vào Firestore
                await addDoc(usersRef, { 
                    displayName: name, 
                    userId: id, 
                    password: pass, 
                    avatar: defaultAvatar, 
                    friends: [] 
                });

                // Tự động lưu session để đăng nhập luôn
                localStorage.setItem("z_display_name", name);
                localStorage.setItem("z_user_id", id);
                localStorage.setItem("z_user_avatar", defaultAvatar);

                showToast("Đăng ký thành công! Đang chuyển hướng...");
                
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1000);

            } catch (err) {
                console.error(err);
                showToast("Lỗi kết nối đến Server!");
            }
        }

        document.getElementById("register-btn").addEventListener("click", handleRegister);

        // Hỗ trợ ấn Enter ở các ô input để đăng ký
        document.querySelectorAll("#register-box input").forEach(input => {
            input.addEventListener("keypress", (e) => {
                if (e.key === "Enter") handleRegister();
            });
        });
    </script>
</body>
</html>
